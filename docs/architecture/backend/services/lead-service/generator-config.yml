# generator-config.yml — contract for scripts/be-module-generator.py
# Module: LEAD · Service: lead-service  (be-architect-scaffold)
#
# LEAD is a domain service (type=standard): owns the lead aggregate in emp_<slug>, computes the
# Maturity Score (6D), versioned qualification rules and dynamic segmentation. Depends on WRKS
# (AccessDecision/JWT) and TechLab AI (qualification assist, optional). Every field is traceable
# to contracts/specs.
# NOTE: list items carry NO inline "# comments" — the generator embeds raw item text into
# generated class/file names, so inline comments would corrupt them.

service: lead-service
type: standard
port: 8082
# bounded_context drives the base package: com.journeyos.<bounded_context> (RULE-09).
bounded_context: lead
# issue_prefix pinned (issues live in a shared GLOBAL dir; auto-scan would be ambiguous).
issue_prefix: LEAD

# ---- Domain (data-model.md §3) ----
# aggregates = root tables (no FK to another table in this context)
# entities   = child/join tables (FK to an aggregate)
domain:
  aggregates:
    - Lead
    - Survey
    - RegraQualificacao
    - Segmento
  entities:
    - PerfilLead
    - AtributoPerfil
    - Pergunta
    - RespostaSurvey
    - CondicaoRegra
    - MaturityScore
    - ScoreDimensao
    - LeadSegmento

# ---- Application services (api-contract.md) ----
application_services:
  - name: LeadService
    operations: [create, findById, listAll, update, anonimizar, expurgar]
  - name: SurveyService
    operations: [create, findById, listAll, update, responder]
  - name: QualificationService
    operations: [listRules, createRule, activateRule, qualify]
  - name: SegmentService
    operations: [create, findById, listAll, update, delete, listLeads]

# ---- Enums (data-model.md CHECK constraints) ----
enums:
  EstadoQualificacao: [NOVO, EM_QUALIFICACAO, QUALIFICADO, NAO_QUALIFICADO, DESCARTADO, ANONIMIZADO]
  BaseLegal: [CONSENTIMENTO, LEGITIMO_INTERESSE, EXECUCAO_CONTRATO, OBRIGACAO_LEGAL]
  Dimensao: [PERFIL, ENGAJAMENTO, INTENCAO, CAPACIDADE, URGENCIA, ADERENCIA]
  OrigemAtributo: [FORM, SURVEY, INTEGRACAO, ASSIST_IA, MANUAL]
  TipoAtributo: [TEXTO, NUMERO, BOOLEANO, DATA, ENUM]
  TipoPergunta: [TEXTO, NUMERO, BOOLEANO, ESCOLHA, ESCALA]
  OperadorCondicao: [EQ, NEQ, GT, GTE, LT, LTE, IN, EXISTS]

# ---- Feign clients (hub-integration.md §1) ----
feign_clients:
  - name: AccessEvaluateClient
    service: wrks-service
    url_prop: journey-os.wrks.url

# ---- Consumed events (event-contracts.md §2) ----
consumed_events:
  - event: journey-os.empresa.provisionada
    destination: journey-os.empresa.provisionada
    consumer_class: EmpresaProvisionadaConsumer
  - event: journey-os.modelo.acesso.alterado
    destination: journey-os.modelo.acesso.alterado
    consumer_class: ModeloAcessoAlteradoConsumer

# ---- Published events (event-contracts.md §1) ----
events:
  published:
    - com.journeyos.lead.event.LeadCapturado
    - com.journeyos.lead.event.LeadQualificado
    - com.journeyos.lead.event.LeadScoreAtualizado
    - com.journeyos.lead.event.LeadSegmentoAlterado

# ---- Outbound ports beyond *RepositoryPort ----
# TechLabQualification=TechLab AI qualification (assist+fallback, Resilience4j);
# LeadSearch=Elasticsearch leads index; LeadEventPublisher=Kafka outbox;
# AccessDecisionCache=Redis (invalidated by modelo.acesso.alterado).
outbound_ports:
  - TechLabQualificationPort
  - LeadSearchPort
  - LeadEventPublisherPort
  - AccessDecisionCachePort

# ---- Extra dependencies (beyond default web/jpa/test stack) ----
# Elasticsearch client is provided by the elastic-stack overlay / elastic-client-lib (not pinned here).
extra_dependencies:
  - "org.springframework.boot:spring-boot-starter-data-redis"
  - "org.springframework.boot:spring-boot-starter-oauth2-resource-server"
  - "org.springframework.kafka:spring-kafka"
  - "io.github.resilience4j:resilience4j-spring-boot3"
  - "org.springframework.security:spring-security-test"
