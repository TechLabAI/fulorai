# docker-compose.yml
version: '3.9'

services:

  mig-db:
    image: postgres:16
    container_name: mig-postgres
    environment:
      POSTGRES_DB: mig_dev
      POSTGRES_USER: mig
      POSTGRES_PASSWORD: mig_dev_pass
    ports:
      - "5432:5432"
    volumes:
      - mig-pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mig -d mig_dev"]
      interval: 10s
      timeout: 5s
      retries: 5


  mig-activemq:
    image: apache/activemq-classic:5.18
    container_name: mig-activemq
    ports:
      - "61616:61616"   # Broker JMS
      - "8161:8161"     # Console de administração
    environment:
      ACTIVEMQ_ADMIN_LOGIN: admin
      ACTIVEMQ_ADMIN_PASSWORD: admin
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8161/api/jolokia/read/org.apache.activemq:type=Broker,brokerName=localhost,service=Health/CurrentStatus || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5


volumes:
  mig-pgdata:
